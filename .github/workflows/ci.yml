name: CI

on:
  push:
  pull_request:

jobs:
  # ----------------------------------------------------------
  # Python tests
  # ----------------------------------------------------------

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: pip install -e .

      - name: Install test dependencies
        run: pip install pytest

      - name: Run tests
        run: pytest

  # ----------------------------------------------------------
  # Docker - examples
  # ----------------------------------------------------------

  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build Docker image
        run: docker build -t lgbeam-examples .

  # ----------------------------------------------------------
  # Docker - tests
  # ----------------------------------------------------------

  docker-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build test Docker image
        run: docker build -f Dockerfile.test -t lgbeam-tests .

      - name: Run tests inside Docker
        run: docker run --rm lgbeam-tests
        